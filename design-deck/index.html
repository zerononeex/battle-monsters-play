<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Monsters — Design Directions Deck</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#14161c;color:#eef1f6}
header.deck{position:sticky;top:0;z-index:9;background:#14161cee;backdrop-filter:blur(6px);padding:10px 16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #2c303c}
header.deck h1{font-size:17px}
header.deck .nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
header.deck .nav button{background:#232733;color:#eef1f6;border:1px solid #3a4052;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
header.deck .nav button.on{background:#ffd23f;color:#14161c;border-color:#ffd23f;font-weight:700}
main{max-width:1180px;margin:0 auto;padding:18px 14px 60px}
.slide{display:none}.slide.on{display:block}
.slide h2{font-size:26px;margin:6px 0 2px}
.slide .vibe{color:#aeb6c6;font-size:15px;margin-bottom:4px}
.slide .verdict{font-size:14px;color:#ffd23f;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.winlab{font-size:12px;letter-spacing:.12em;color:#8b93a5;margin:0 0 5px 2px;font-weight:700}
/* ---- window frame + theme vars ---- */
.win{border-radius:14px;padding:10px;aspect-ratio:16/8.4;display:flex;flex-direction:column;gap:7px;overflow:hidden;
 --panel:#fff;--ink:#1c2130;--acc:#ffd23f;--acc2:#3a7bd5;--tile:#eef2f7;--line:#1c2130;--rad:12px;--sh:0 3px 0 rgba(0,0,0,.25);
 font-family:var(--font,system-ui);color:var(--ink)}
.t1{--bg:#b3202c;--panel:#f8f1d4;--ink:#23242a;--acc:#ffd23f;--acc2:#2b50aa;--tile:#e9e2b8;--line:#23242a;--rad:9px;--font:'Trebuchet MS',system-ui;background:linear-gradient(180deg,#c62836,#8f1620)}
.t2{--bg:#0b1030;--panel:#1b2350;--ink:#eaf6ff;--acc:#37e0ff;--acc2:#ff5da2;--tile:#252d63;--line:#37e0ff;--rad:14px;background:radial-gradient(120% 160% at 50% 0%,#232c6e,#0b1030)}
.t3{--bg:#fdeeda;--panel:#fffaf0;--ink:#5a4632;--acc:#ffb59e;--acc2:#8fc1a0;--tile:#fdf0da;--line:#b08968;--rad:20px;--sh:0 4px 10px rgba(160,110,60,.18);--font:'Comic Sans MS','Chalkboard SE',system-ui;background:linear-gradient(180deg,#ffe9c9,#fdeeda)}
.t4{--bg:#9bbc0f;--panel:#e0f8d0;--ink:#0f380f;--acc:#8bac0f;--acc2:#306230;--tile:#cfe8a8;--line:#0f380f;--rad:2px;--sh:3px 3px 0 #0f380f;--font:'Courier New',monospace;background:#9bbc0f}
.t5{--bg:#57c7ff;--panel:#ffffff;--ink:#101418;--acc:#ffd21f;--acc2:#ff7847;--tile:#eef7ff;--line:#101418;--rad:16px;--sh:0 4px 0 #101418;background:linear-gradient(180deg,#57c7ff,#aee7ff)}
.bar{display:flex;align-items:center;gap:6px}
.chip{background:var(--panel);border:2.5px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;box-shadow:var(--sh)}
.gear{margin-left:auto;background:var(--panel);border:2.5px solid var(--line);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:12px;box-shadow:var(--sh)}
.tiles{display:flex;gap:7px;flex:1}
.rtile{flex:1;border:3px solid var(--line);border-radius:var(--rad);background:var(--tile);box-shadow:var(--sh);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:5px}
.rtile img.map{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.95}
.rtile .rn{position:relative;font-weight:900;font-size:13px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.rtile .rp{position:relative;font-size:9px;font-weight:800;background:var(--ink);color:var(--panel);border-radius:99px;padding:1px 6px;align-self:flex-start}
.rtile.lock{filter:grayscale(.7);opacity:.75}
.rtile .lk{position:absolute;top:5px;right:7px;font-size:13px}
.btns{display:flex;gap:7px}
.btn{flex:1;text-align:center;background:var(--panel);border:3px solid var(--line);border-radius:999px;padding:5px 0;font-weight:900;font-size:12.5px;box-shadow:var(--sh)}
.btn.hot{background:var(--acc)}
.gridc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:1}
.card{background:var(--panel);border:2.5px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;position:relative}
.card img{width:78%;height:62%;object-fit:contain}
.card .nm{font-size:9.5px;font-weight:800;line-height:1}
.card .lv{position:absolute;top:2px;left:4px;font-size:8px;font-weight:900;background:var(--acc);border:1.5px solid var(--line);border-radius:99px;padding:0 4px}
.card.sil{background:var(--tile)}
.card.sil img{filter:brightness(0);opacity:.32}
.card .ev{position:absolute;top:2px;right:3px;font-size:7.5px;font-weight:900;color:#c62828}
.pop{margin:auto;background:var(--panel);border:3.5px solid var(--line);border-radius:calc(var(--rad) + 4px);box-shadow:0 10px 24px rgba(0,0,0,.35);width:86%;padding:9px 12px;display:flex;flex-direction:column;gap:5px;align-items:center}
.pop h3{font-size:15px}
.pop .big{width:86px;height:64px;object-fit:contain}
.stats{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.stat{border:2px solid var(--line);border-radius:99px;padding:1px 7px;font-size:9.5px;font-weight:800;background:var(--tile)}
.xpbar{width:78%;height:8px;border:2px solid var(--line);border-radius:99px;background:var(--tile);overflow:hidden}
.xpbar i{display:block;height:100%;width:62%;background:var(--acc2)}
.use{background:var(--acc);border:2.5px solid var(--line);border-radius:99px;padding:3px 12px;font-weight:900;font-size:11px;box-shadow:var(--sh)}
.slots{display:flex;gap:5px;flex:1}
.slot{flex:1;background:var(--panel);border:2.5px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:2px}
.slot img{width:86%;height:60%;object-fit:contain}
.slot .nm{font-size:8.5px;font-weight:800}
.slot.empty{background:transparent;border-style:dashed;box-shadow:none;color:var(--ink);font-size:15px;font-weight:900;opacity:.65}
.presets{display:flex;gap:4px;align-items:center}
.pnum{width:19px;height:19px;border:2px solid var(--line);border-radius:6px;background:var(--panel);font-size:10px;font-weight:900;display:grid;place-items:center;box-shadow:var(--sh)}
.pnum.on{background:var(--acc)}
.buy{margin-left:auto;font-size:10px;font-weight:900;background:var(--acc);border:2px solid var(--line);border-radius:99px;padding:2px 8px}
.hint{background:var(--panel);border:2.5px solid var(--line);border-radius:99px;font-size:10.5px;font-weight:700;padding:3px 10px;text-align:center;box-shadow:var(--sh)}
.intro p{color:#c6cdd9;font-size:15.5px;line-height:1.55;margin:8px 0}
.intro b{color:#fff}
table.pick{width:100%;border-collapse:collapse;margin-top:10px}
table.pick td,table.pick th{border:1px solid #333949;padding:8px 10px;font-size:14px;text-align:left}
table.pick th{background:#1d212c}
code{background:#232733;padding:1px 6px;border-radius:6px}
</style></head>

function chars(){const own=['bulbasaur','charmander','squirtle','pikachu','magikarp'];
 const sil=['snorlax','pikachu','charmander','squirtle','bulbasaur'];
 let c=own.map((s,i)=>`<div class="card"><span class="lv">Lv ${21-i*5}</span>${i<3?'<span class="ev">EVOLVE!</span>':''}<img src="${SP[s]}"><span class="nm">${NM[s]}</span></div>`).join('');
 c+=sil.map(s=>`<div class="card sil"><img src="${SP[s]}"><span class="nm">???</span></div>`).join('');
 return `<div class="bar"><span class="chip">◀ All Characters · 5 / 37</span><span class="chip" style="margin-left:auto">🎒 Items</span></div><div class="gridc">${c}</div>`}
function detail(){return `<div class="pop"><h3>Pikachu · Lv 21</h3>
 <div class="bar" style="gap:8px"><img class="big" src="${SP.pikachu}"><div class="card sil" style="width:64px;height:64px"><img src="${SP.pikachu}"><span class="nm">??? ⚡Stone</span></div></div>
 <div class="xpbar"><i></i></div>
 <div class="stats"><span class="stat">❤️ HP 280</span><span class="stat">💥 Power 39</span><span class="stat">👟 Speed 56</span><span class="stat">⚡ AP 90</span><span class="stat">⏱ Recharge 4s</span></div>
 <div class="bar"><span class="use">⚡ Use Thunder Stone ×1</span><span class="use" style="background:var(--panel)">Close</span></div></div>`}
function team(){const own=['bulbasaur','charmander','squirtle','pikachu','magikarp'];
 let s=own.map((p,i)=>`<div class="slot"><span class="lv" style="position:absolute;top:2px;left:3px;font-size:7.5px;font-weight:900">Lv ${21-i*5}</span><img src="${SP[p]}"><span class="nm">${NM[p]}</span></div>`).join('');
 s+='<div class="slot empty">+</div>'.repeat(5);
 let pr=Array.from({length:10},(_,i)=>`<span class="pnum${i==0?' on':''}">${i+1}</span>`).join('');
 return `<div class="bar"><span class="chip">◀ Team 5 / 10</span><span class="chip">Tap = switch form · ✕ = take off</span></div>
 <div class="slots">${s}</div>
 <div class="presets"><span style="font-size:10px;font-weight:900">Presets</span>${pr}<span class="buy">+ 🎟 50</span></div>
 <div class="hint">Everyone you own is on the team!</div>`}
const WINS=[['🏠 HOME',home],['📖 ALL CHARACTERS',chars],['🔍 CHARACTER DETAIL',detail],['🎴 TEAM',team]];
const THEMES=[
 {cls:'t1',name:'Direction 1 — Pokédex Red',vibe:'The game lives inside a chunky red Pokédex: cream LCD panels, hard shadows, toy-like buttons.',verdict:'Most "Pokémon" feeling of the five. Kids instantly get it. Busy if overdone — discipline needed.'},
 {cls:'t2',name:'Direction 2 — Midnight Arena',vibe:'A night stadium: deep navy, glowing cyan and pink, every card lit like a marquee.',verdict:'Feels premium and exciting for battles. Darkest option — check it still feels friendly for a 7-year-old.'},
 {cls:'t3',name:'Direction 3 — Cozy Storybook',vibe:'Soft watercolor warmth, round corners everywhere, gentle browns and creams — a picture book come alive.',verdict:'Warmest and calmest. Great for the younger reader; least "battle" energy of the five.'},
 {cls:'t4',name:'Direction 4 — Retro Game Boy',vibe:'Four shades of green, square corners, dot-matrix type. The 1998 handheld, lovingly rebuilt.',verdict:'Pure nostalgia and super readable. Silhouettes and sprites do all the color work — menus stay green.'},
 {cls:'t5',name:'Direction 5 — Sticker Pop',vibe:'Battle Cats energy: flat sky blue, white sticker cards, thick black outlines, hard drop shadows.',verdict:'Closest to today but with rules — everything is a sticker. Loud, clear, and very tappable for kids.'}];
const main=document.getElementById('main'),nav=document.getElementById('nav');
let html=`<section class="slide intro on" data-s="0"><h2>How to review this deck</h2>
<p>You're not loving the current look, so here are <b>five complete design directions</b>. Each one is shown on the same four windows from your screenshots: <b>Home, All Characters, Character Detail,</b> and <b>Team</b> — same layout and content, five different skins, so you're comparing pure design.</p>
<p><b>You don't have to pick one direction for everything.</b> Mix and match is allowed and normal: e.g. "Home from 2, Characters from 5, Detail from 1, Team from 5." Battle, map and gacha screens will follow whatever system wins.</p>
<p>When you've looked, just tell me your picks per window (or one direction overall) and I'll write the chosen design into the game's design spec for the next phase. The sprites in the mockups are the game's real sprites.</p>
<table class="pick"><tr><th>Window</th><th>Your pick (1–5)</th></tr>
<tr><td>Home</td><td></td></tr><tr><td>All Characters</td><td></td></tr><tr><td>Character Detail</td><td></td></tr><tr><td>Team</td><td></td></tr></table></section>`;
THEMES.forEach((t,i)=>{html+=`<section class="slide" data-s="${i+1}"><h2>${t.name}</h2><div class="vibe">${t.vibe}</div><div class="verdict">Kakashi's take: ${t.verdict}</div><div class="grid">`+
 WINS.map(w=>`<div><p class="winlab">${w[0]}</p><div class="win ${t.cls}">${w[1]()}</div></div>`).join('')+`</div></section>`});
main.innerHTML=html;
const labels=['Intro','1 · Pokédex','2 · Midnight','3 · Storybook','4 · Game Boy','5 · Sticker Pop'];
labels.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l;if(i==0)b.className='on';
 b.onclick=()=>{document.querySelectorAll('.slide').forEach(s=>s.classList.toggle('on',+s.dataset.s==i));
 nav.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');window.scrollTo({top:0})};nav.appendChild(b)});
</script></body></html>
